<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7e1d6;
    --ink: #1c1915;
    --muted: #5e574c;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Outfit", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.05rem/1.5 var(--sans); }
  .page { max-width: 720px; margin: 0 auto; padding: 64px 22px 80px; }
  .kicker { margin: 0 0 12px; font: 600 .74rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #8a4b32; }
  h1 { margin: 0 0 12px; font: 650 clamp(2.4rem, 6vw, 3.6rem)/1.02 var(--serif); letter-spacing: -.03em; }
  .dek { margin: 0 0 32px; color: var(--muted); font-size: 1.12rem; }
  .topics { list-style: none; margin: 0; padding: 0; border-top: 1px solid #1c1915; }
  .topics a { display: grid; gap: 6px; padding: 22px 0; border-bottom: 1px solid #cfc6b8; color: inherit; text-decoration: none; }
  .topics a:hover h2 { text-decoration: underline; }
  .topics a:focus-visible { outline: 3px solid #e1a23a; outline-offset: 4px; }
  h2 { margin: 0; font: 560 1.7rem/1.15 var(--serif); letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
  @media (max-width: 760px) { .page { padding-top: 40px; } }
</style>
</head>
<body>
<main class="page">
  <p class="kicker">Topics</p>
  <h1>Writing</h1>
  <p class="dek">Each topic is its own section. Snowfall is the first.</p>
  <ul class="topics">
    <li>
      <a href="snowfall/">
        <h2>Snowfall</h2>
        <p>Two versions of how El Niño and La Niña change a ski season. One written by the author, one written by AI.</p>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
